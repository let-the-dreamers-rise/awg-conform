name: conform
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
jobs:
  matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: /tmp/awg-src/awgtun -> target
      - name: Install tools
        run: sudo apt-get update -q && sudo apt-get install -y -q tcpdump iproute2 iputils-ping python3-cryptography
      - name: Unit tests (checker against hand-built vectors)
        run: python3 -m unittest discover -s tests -v
      - name: Build implementations at pinned commits
        run: sudo -E env "PATH=$PATH" AWG_BIN=/opt/awg/bin ./scripts/build-impls.sh
      - name: Run matrix
        run: sudo -E env "PATH=$PATH" AWG_BIN=/opt/awg/bin python3 -m awgconform.matrix --out out
      - name: Reference pair must interoperate
        run: python3 scripts/assert_reference.py out/matrix.json
      - run: cat out/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: awg-conform-out
          path: out
